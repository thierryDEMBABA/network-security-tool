name: netsecure

services:
  frontend:
    build: ./frontend
    image: netsecure-frontend:dev
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - frontend

  api:
    build: ./api
    image: netsecure-api:dev
    env_file: .env
    environment:
      DB_HOST: db
      TARGETS: "api=api:5000,db=db:5432,frontend=frontend:80"
    # Pas de "ports:" : l'API n'est joignable que via le réseau Docker (Nginx en reverse proxy)
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  db-data:
